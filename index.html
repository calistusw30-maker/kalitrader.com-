<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deriv Live Analysis</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:white;
      text-align:center;
    }
    header{
      background:#111827;
      padding:15px;
      font-size:24px;
      font-weight:bold;
      color:#22c55e;
    }
    .card{
      background:#1e293b;
      margin:15px;
      padding:15px;
      border-radius:12px;
    }
    input,button{
      padding:12px;
      margin:6px;
      border:none;
      border-radius:8px;
      font-size:16px;
    }
    input{ width:70%; }
    button{
      background:#22c55e;
      color:white;
      cursor:pointer;
    }
    .price{
      font-size:34px;
      color:#38bdf8;
      margin:10px 0;
    }
  </style>
</head>
<body>

<header>📈 Deriv Live Analysis</header>

<div class="card">
  <h3>🔐 Connect Deriv Account</h3>

  <input type="password" id="token" placeholder="Enter Deriv PAT token">

  <br>

  <button id="connectBtn">Connect</button>

  <p id="status">Not connected</p>
</div>

<div class="card">
  <h3>📊 Live Tick Price</h3>
  <div class="price" id="price">--</div>
  <p>Last Digit: <span id="digit">--</span></p>
</div>

<script>
let ws = null;

document.getElementById('connectBtn').addEventListener('click', connectDeriv);

function connectDeriv() {

  const token = document.getElementById('token').value.trim();

  if (!token) {
    alert('Please paste your Deriv PAT token');
    return;
  }

  document.getElementById('status').innerText = 'Connecting...';

  try {

    ws = new WebSocket('wss://ws.derivws.com/websockets/v3');

    ws.onopen = function () {

      ws.send(JSON.stringify({
        authorize: token
      }));
    };

    ws.onmessage = function (event) {

      const data = JSON.parse(event.data);

      if (data.error) {
        document.getElementById('status').innerText =
          '❌ ' + data.error.message;
        return;
      }

      if (data.msg_type === 'authorize') {

        document.getElementById('status').innerText =
          '✅ Connected: ' + data.authorize.loginid;

        ws.send(JSON.stringify({
          ticks: 'R_100',
          subscribe: 1
        }));
      }

      if (data.msg_type === 'tick') {

        const quote = data.tick.quote;

        document.getElementById('price').innerText = quote;

        const digit = quote.toString().slice(-1);

        document.getElementById('digit').innerText = digit;
      }
    };

    ws.onerror = function () {
      document.getElementById('status').innerText = '❌ Connection error';
    };

    ws.onclose = function (e) {
      document.getElementById('status').innerText =
        'Disconnected (' + e.code + ')';
    };

  } catch (err) {

    document.getElementById('status').innerText = '❌ ' + err.message;
  }
}
</script>

</body>
</html>

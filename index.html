<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calis Trading</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      text-align:center;
      padding:40px;
    }
    .box{
      background:#1e293b;
      padding:30px;
      border-radius:15px;
      max-width:400px;
      margin:auto;
    }
    button{
      background:#16a34a;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      width:100%;
    }
    button:hover{background:#15803d;}
    #status{
      margin-top:20px;
      color:#22c55e;
      word-break:break-all;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Calis Trading</h1>
    <p>Login with your Deriv account</p>

    <button onclick="loginDeriv()">Login with Deriv</button>

    <div id="status"></div>
  </div>

<script>
const APP_ID = "YOUR_APP_ID"; // replace with your Deriv app id

function loginDeriv(){
  const redirect = window.location.origin + window.location.pathname;
  const url =
    `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN&redirect_uri=${encodeURIComponent(redirect)}`;

  window.location.href = url;
}

// After login Deriv returns access_token in URL hash
window.onload = () => {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token = params.get("access_token");

  if(token){
    localStorage.setItem("deriv_token", token);
    document.getElementById("status").innerHTML =
      `Logged in successfully!<br>Token: ${token}`;
  }
};
</script>
</body>
</html>

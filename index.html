<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deriv Live Analysis</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:white;
      text-align:center;
    }
    header{
      background:#111827;
      padding:15px;
      font-size:24px;
      font-weight:bold;
      color:#22c55e;
    }
    .card{
      background:#1e293b;
      margin:15px;
      padding:15px;
      border-radius:12px;
    }
    input,button{
      padding:12px;
      margin:6px;
      border:none;
      border-radius:8px;
      font-size:16px;
    }
    input{ width:70%; }
    button{
      background:#22c55e;
      color:white;
      cursor:pointer;
    }
    .price{
      font-size:34px;
      color:#38bdf8;
      margin:10px 0;
    }
  </style>
</head>
<body>

<header>📈 Deriv Live Analysis</header>

<div class="card">
  <h3>🔐 Connect Deriv Account</h3>

  <input type="password" id="token" placeholder="Enter Deriv PAT token">

  <br>

  <button id="connectBtn">Connect</button>

  <p id="status">Not connected</p>
</div>

<div class="card">
  <h3>📊 Live Tick Price</h3>
  <div class="price" id="price">--</div>
  <p>Last Digit: <span id="digit">--</span></p>
</div>

<script>
const ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

ws.onopen = () => {
  document.getElementById('status').innerText = 'Live feed connected';

  ws.send(JSON.stringify({
    ticks: 'R_100',
    subscribe: 1
  }));
};

ws.onmessage = (e) => {
  const data = JSON.parse(e.data);

  if (data.msg_type === 'tick') {
    const quote = data.tick.quote;

    // Show live price
    document.getElementById('price').innerText = quote;

    // Show last digit
    const digit = quote.toString().slice(-1);
    document.getElementById('digit').innerText = digit;
  }
};

ws.onerror = () => {
  document.getElementById('status').innerText = 'Connection error';
};

ws.onclose = () => {
  document.getElementById('status').innerText = 'Feed disconnected';
};
</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kali Trader</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}
header{
  background:#111827;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}
.hero{
  padding:60px 20px;
}
button{
  background:#16a34a;
  color:white;
  border:none;
  padding:15px 30px;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
}
button:hover{
  background:#15803d;
}
.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:15px;
}
footer{
  margin-top:40px;
  padding:20px;
  background:#111827;
}
</style>
</head>
<body>

<header>Kali Trader</header>

<div class="hero">
  <h1>Trade Smarter with Kali Trader</h1>
  <p>Forex • Deriv • Signals • Analysis</p>
  <button onclick="loginDeriv()">Login with Deriv</button>
</div>

<div class="card">
  <h2>Live Signals</h2>
  <p>Coming soon</p>
</div>

<div class="card">
  <h2>Market Analysis</h2>
  <p>Coming soon</p>
</div>

<div class="card">
  <h2>WhatsApp Support</h2>
  <a href="https://wa.me/254700000000" style="color:#22c55e;font-size:18px;">
    Chat on WhatsApp
  </a>
</div>

<footer>
  © 2026 Kali Trader
</footer>

<script>
const APP_ID = "33ZvBZZimVIet6YleNCRi";

function loginDeriv(){
  const redirect = window.location.origin + window.location.pathname;
  const url =
    `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN&redirect_uri=${encodeURIComponent(redirect)}`;

  window.location.href = url;
}

window.onload = () => {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token = params.get("access_token");

  if(token){
    alert("Logged in successfully!");
    localStorage.setItem("deriv_token", token);
  }
};
</script>

</body>
</html>
